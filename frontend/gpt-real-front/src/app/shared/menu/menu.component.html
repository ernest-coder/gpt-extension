<mat-sidenav-container class="h-screen">
    <mat-sidenav mode="side" opened class="p-1 pt-4 w-16">
        <div class="flex flex-col items-start">
            <div (click)="loadUserPage()" class="pb-4 cursor-pointer">
                <div class="p-1 rounded" [ngClass]="{
                    'bg-blue-500': isActive('/user'),
                    'hover:bg-blue-100': !isActive('/user')}">
                    <svg matTooltip="{{ 'global.menu.user' | translate }}" [attr.stroke]="isActive('/user') ? 'white' : 'black'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" class="h-6 w-6 transition-all duration-200">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                    </svg>
                </div>
            </div>
            <div (click)="loadChatPage()" class="pb-4 cursor-pointer">
                <div class="p-1 rounded" [ngClass]="{ 'bg-blue-500': isActive('/chat'),
                'hover:bg-blue-100': !isActive('/chat')}">
                    <svg matTooltip="{{ 'global.menu.chat' | translate }}" [attr.stroke]="isActive('/chat') ? 'white' : 'black'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" class="h-6 w-6 transition-all duration-200">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 0 1-2.555-.337A5.972 5.972 0 0 1 5.41 20.97a5.969 5.969 0 0 1-.474-.065 4.48 4.48 0 0 0 .978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25Z" />
                    </svg>
                </div>
            </div>
            <div (click)="loadTranslatePage()" class="pb-4 cursor-pointer">
                <div class="p-1 rounded" [ngClass]="{ 'bg-blue-500': isActive('/translate'),
                'hover:bg-blue-100': !isActive('/translate')}">
                    <svg matTooltip="{{ 'global.menu.translate' | translate }}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" [attr.stroke]="isActive('/translate') ? 'white' : 'black'" class="h-6 w-6 transition-all duration-200">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m10.5 21 5.25-11.25L21 21m-9-3h7.5M3 5.621a48.474 48.474 0 0 1 6-.371m0 0c1.12 0 2.233.038 3.334.114M9 5.25V3m3.334 2.364C11.176 10.658 7.69 15.08 3 17.502m9.334-12.138c.896.061 1.785.147 2.666.257m-4.589 8.495a18.023 18.023 0 0 1-3.827-5.802" />
                    </svg>
                </div>
            </div>
            <div (click)="loadGrammarPage()" class="pb-4 cursor-pointer">
                <div class="p-1 rounded" [ngClass]="{ 'bg-blue-500': isActive('/grammar'),
                'hover:bg-blue-100': !isActive('/grammar')}">
                    <svg matTooltip="{{ 'global.menu.grammar' | translate }}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" [attr.stroke]="isActive('/grammar') ? 'white' : 'black'" class="h-6 w-6 transition-all duration-200">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.125 2.25h-4.5c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125v-9M10.125 2.25h.375a9 9 0 0 1 9 9v.375M10.125 2.25A3.375 3.375 0 0 1 13.5 5.625v1.5c0 .621.504 1.125 1.125 1.125h1.5a3.375 3.375 0 0 1 3.375 3.375M9 15l2.25 2.25L15 12" />
                    </svg>
                </div>
            </div>
        </div>
    </mat-sidenav>
</mat-sidenav-container>
