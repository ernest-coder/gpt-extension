<div class="flex flex-col h-screen justify-between p-3">
    <div>
        <h1 class="text-3xl font-bold mb-4">AI Chat</h1>
        <p>How can I help you?</p>
    </div>

    <div class="flex flex-col mb-4">
        <div class="flex flex-row pb-2 gap-2">
            <div class="cursor-pointer">
                <svg matTooltip="Upload file" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m18.375 12.739-7.693 7.693a4.5 4.5 0 0 1-6.364-6.364l10.94-10.94A3 3 0 1 1 19.5 7.372L8.552 18.32m.009-.01-.01.01m5.699-9.941-7.81 7.81a1.5 1.5 0 0 0 2.112 2.13" />
                </svg>
            </div>
            <div class="cursor-pointer">
                <svg matTooltip="Chat with web page" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0 1 12 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 0 1 3 12c0-1.605.42-3.113 1.157-4.418" />
                  </svg>
            </div>
        </div>
        <mat-form-field appearance="fill" class="w-full">
            <textarea matInput placeholder="Type your question here..." class="rounded-lg text-sm transition duration-300 overflow-auto" rows="1" cdkTextareaAutosize [cdkAutosizeMaxRows]="4"></textarea>
            <button mat-icon-button matSuffix aria-label="Send">
                <mat-icon class="text-blue-500 hover:text-blue-700 transition duration-200 text-base">send</mat-icon>
            </button>
        </mat-form-field>
    </div>
</div>
