<div class="p-3">
    <h1 class="text-3xl font-bold mb-7">Sign up</h1>
    <div>
        <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="flex flex-col items-center">
            <mat-form-field class="w-full">
                <mat-label>Email</mat-label>
                <input matInput type="email" formControlName="email" class="text-sm" />
                <mat-error *ngIf="signupForm.get('email')?.hasError('required')">Email is required.</mat-error>
                <mat-error *ngIf="signupForm.get('email')?.hasError('email')">Invalid email format.</mat-error>
            </mat-form-field>

            <mat-form-field class="w-full">
                <mat-label>Password</mat-label>
                <input matInput type="password" formControlName="password" class="text-sm" />
                <mat-error *ngIf="signupForm.get('password')?.hasError('required')">Password is required.</mat-error>
                <mat-error *ngIf="signupForm.get('password')?.hasError('minlength')">
                    Password must be at least 6 characters long.
                </mat-error>
            </mat-form-field>

            <app-button-primary class="w-3/4" type="submit" [disabled]="signupForm.invalid">
                Sign Up
            </app-button-primary>
        </form>
        <p class="mt-8 text-center">
            <span>Already have an account?</span>
            <span (click)="routerLogin()" class="cursor-pointer text-blue-500 font-semibold ml-2">Log in</span>
        </p>
    </div>

</div>
