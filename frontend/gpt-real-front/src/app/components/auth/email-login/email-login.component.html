<div class="p-3">
    <h1 class="text-3xl font-bold mb-7">Login</h1>
    <div class="mb-4">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col items-center">
            <mat-form-field class="w-full">
                <mat-label>Email</mat-label>
                <input matInput type="email" formControlName="email" class="text-sm" />
                <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required.</mat-error>
                <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Invalid email format.</mat-error>
            </mat-form-field>

            <mat-form-field class="w-full">
                <mat-label>Password</mat-label>
                <input matInput type="password" formControlName="password" class="text-sm" />
                <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required.</mat-error>
                <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
                    Password must be at least 6 characters long.
                </mat-error>
            </mat-form-field>

            <app-button-primary class="w-3/4" type="submit" [disabled]="loginForm.invalid">
                Login
            </app-button-primary>
        </form>
        <p class="mt-8 text-center">
            <span>Don't have an account?</span>
            <span (click)="routerSignup()" class="cursor-pointer text-blue-500 font-semibold ml-2">Sign up</span>
        </p>
    </div>
    <div class="flex flex-row items-center gap-3 justify-center">
        <div (click)="loginWithGoogle()">

                    <path fill-rule="evenodd" clip-rule="evenodd" d="M10 0C4.47715 0 0 4.47715 0 10C0 15.5228 4.47715 20 10 20C15.5228 20 20 15.5228 20 10C20 4.47715 15.5228 0 10 0Z" fill="white"></path>

            <span class="w-10 h-10 border rounded-full p-1 flex items-center justify-center cursor-pointer hover:bg-gray-100">
